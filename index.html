<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Group (Google Meet Class)</title>
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <!-- SweetAlert2 Library -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    html, body {
      width: 100%;
      height: 100%;
    }
    
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, 
        rgba(66, 133, 244, 0.12) 0%, 
        rgba(234, 67, 53, 0.10) 35%, 
        rgba(251, 188, 5, 0.10) 70%, 
        rgba(52, 168, 83, 0.12) 100%
      );
      font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
      color: #202124;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card {
      background: #ffffff;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
      max-width: 450px;
      width: 100%;
      text-align: center;
    }

    h1 {
      font-size: 24px;
      font-weight: 500;
      margin-bottom: 12px;
      color: #1a73e8;
    }

    p {
      color: #5f6368;
      font-size: 15px;
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .btn-join {
      background-color: #1a73e8;
      color: #ffffff;
      border: none;
      padding: 12px 28px;
      font-size: 16px;
      font-weight: 500;
      border-radius: 8px;
      cursor: pointer;
      transition: background-color 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      display: inline-block;
    }

    .btn-join:hover {
      background-color: #1557b0;
      box-shadow: 0 2px 6px rgba(26, 115, 232, 0.4);
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>The Group Class</h1>
    <p>Click below to join the scheduled Google Meet session.</p>
    <button id="joinBtn" class="btn-join">Join Meeting</button>
  </div>

  <script>
    // Updated Meet Link
    const MEET_URL = "https://meet.google.com/rxm-asnc-gih";

    document.getElementById("joinBtn").addEventListener("click", function() {
      Swal.fire({
        title: 'Ready to join?',
        text: 'You will be redirected to the Google Meet session.',
        icon: 'info',
        showCancelButton: true,
        confirmButtonColor: '#1a73e8',
        cancelButtonColor: '#d33',
        confirmButtonText: 'Join Now'
      }).then((result) => {
        if (result.isConfirmed) {
          window.open(MEET_URL, '_blank');
        }
      });
    });
  </script>
</body>
</html>
