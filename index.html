<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Group (Google Meet Class)| Meeting Room</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --bg: #202124;
    --surface: #28292c;
    --surface-2: #3c4043;
    --blue: #8ab4f8;
    --blue-solid: #1a73e8;
    --text: #e8eaed;
    --text-muted: #9aa0a6;
    --border: #5f6368;
    --red: #ea4335;
    --green: #34a853;
  }

  body {
    min-height: 100vh;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
    color: var(--text);
    padding: 24px;
  }

  .topbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 64px;
    display: flex;
    align-items: center;
    padding: 0 24px;
    font-size: 22px;
    font-weight: 400;
    color: var(--text-muted);
    letter-spacing: 0.01em;
  }
  .topbar b { color: var(--text); font-weight: 500; margin-right: 6px; }

  .clock-badge {
    position: fixed;
    top: 20px; right: 24px;
    font-size: 13px;
    color: var(--text-muted);
    font-family: 'Roboto', Arial, sans-serif;
  }

  .wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 56px;
    flex-wrap: wrap;
    max-width: 980px;
    width: 100%;
  }

  .preview {
    width: 420px;
    max-width: 92vw;
  }
  .tile {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 10;
    background: var(--surface);
    border-radius: 12px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .avatar {
    width: 96px;
    height: 96px;
    border-radius: 50%;
    background: var(--blue-solid);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 36px;
    font-weight: 500;
    color: #fff;
    letter-spacing: 0.02em;
  }
  .tile-tag {
    position: absolute;
    bottom: 12px;
    left: 14px;
    font-size: 12px;
    color: var(--text-muted);
    background: rgba(0,0,0,0.35);
    padding: 4px 10px;
    border-radius: 6px;
  }

  .controls {
    display: flex;
    justify-content: center;
    gap: 14px;
    margin-top: 18px;
  }
  .control-btn {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--surface-2);
    border: none;
    color: var(--text);
    font-size: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  .control-btn:hover { background: #4a4d51; }
  .control-btn.off { background: var(--red); }
  .control-btn.off:hover { background: #d33b2c; }

  .device-row {
    margin-top: 16px;
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
  }

  .join-panel {
    width: 340px;
    max-width: 92vw;
  }
  .join-title {
    font-size: 26px;
    font-weight: 400;
    color: var(--text);
    margin-bottom: 8px;
  }
  .join-sub {
    font-size: 14px;
    color: var(--text-muted);
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .field-label {
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 6px;
    display: block;
  }

  .input-wrap { margin-bottom: 20px; }
  input {
    width: 100%;
    padding: 13px 14px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }
  input::placeholder { color: #6f7378; }
  input:focus { border-color: var(--blue); border-width: 2px; padding: 12px 13px; }

  .btn {
    width: 100%;
    padding: 13px;
    background: var(--blue-solid);
    border: none;
    border-radius: 24px;
    color: #fff;
    font-family: 'Google Sans', 'Roboto', Arial, sans-serif;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: 0.01em;
    cursor: pointer;
    transition: background 0.2s, opacity 0.2s;
  }
  .btn:hover { background: #1765cc; }
  .btn.disabled {
    background: var(--surface-2);
    color: var(--text-muted);
    cursor: not-allowed;
    opacity: 0.7;
  }
  .btn.disabled:hover { background: var(--surface-2); }

  .meta-row {
    margin-top: 24px;
    padding-top: 18px;
    border-top: 1px solid var(--surface-2);
    font-size: 12px;
    color: var(--text-muted);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .status-dot {
    display: inline-block;
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
  }
  .status-dot.closed { background: var(--red); }

  .swal2-popup {
    background: var(--surface) !important;
    border: 1px solid var(--surface-2) !important;
    color: var(--text) !important;
    font-family: 'Google Sans', 'Roboto', Arial, sans-serif !important;
    border-radius: 12px !important;
  }
  .swal2-title { color: #fff !important; font-weight: 500 !important; }
  .swal2-content { color: var(--text-muted) !important; }
  .swal2-confirm {
    background: var(--blue-solid) !important;
    border: none !important;
    color: #fff !important;
    border-radius: 20px !important;
    font-family: 'Google Sans', 'Roboto', Arial, sans-serif !important;
    padding: 8px 24px !important;
  }

  @media (max-width: 760px) {
    .wrap { flex-direction: column; gap: 32px; }
    .topbar { font-size: 18px; }
  }
</style>
</head>
<body>

<div class="topbar"><b>The Group</b> Meeting Room</div>
<div class="clock-badge" id="clock"></div>

<div class="wrap">
  <div class="preview">
    <div class="tile">
      <div class="avatar" id="avatarInitial">?</div>
      <div class="tile-tag">Camera is off</div>
    </div>
    <div class="controls">
      <button class="control-btn off" type="button" title="Camera off">📷</button>
      <button class="control-btn off" type="button" title="Mic off">🎙</button>
    </div>
    <div class="device-row">No camera or microphone connected</div>
  </div>

  <div class="join-panel">
    <div class="join-title">Ready to join?</div>
    <div class="join-sub">No one else is here. Enter your name to request access to this meeting.</div>

    <label class="field-label">Your name</label>
    <div class="input-wrap">
      <input id="name" type="text" placeholder="Enter your name" autocomplete="off">
    </div>

    <button class="btn" id="joinBtn" onclick="join()"><span id="joinBtnLabel">Request Access</span></button>

    <div class="meta-row">
      <div><span class="status-dot" id="statusDot"></span><span id="statusText">Open now</span></div>
      <div>Closes 7:00 PM IST</div>
    </div>
  </div>
</div>

<script>
  const MEETING_URL = 'https://meet.google.com/mwf-faaf-vjy';
  const ALLOWED = ['avadhoot','ethan'];
  const CLOSE_MINUTES = 19 * 60;

  const style = {
    background:'#28292c',
    color:'#e8eaed',
    confirmButtonColor:'#1a73e8',
    customClass:{popup:'swal2-popup',title:'swal2-title',confirmButton:'swal2-confirm'}
  };

  function isOpen(){
    const now = new Date();
    return (now.getHours()*60 + now.getMinutes()) < CLOSE_MINUTES;
  }

  function refreshRoomState(){
    const open = isOpen();
    const btn = document.getElementById('joinBtn');
    const dot = document.getElementById('statusDot');
    const statusText = document.getElementById('statusText');

    if(open){
      btn.classList.remove('disabled');
      dot.classList.remove('closed');
      statusText.textContent = 'Open now';
    } else {
      btn.classList.add('disabled');
      dot.classList.add('closed');
      statusText.textContent = 'Room closed';
    }
  }

  function updateClock(){
    const n=new Date();
    const h=String(n.getHours()).padStart(2,'0');
    const m=String(n.getMinutes()).padStart(2,'0');
    const s=String(n.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent=h+':'+m+':'+s+' IST';
    refreshRoomState();
  }
  setInterval(updateClock,1000);
  updateClock();

  document.getElementById('name').addEventListener('input', e=>{
    const v = e.target.value.trim();
    document.getElementById('avatarInitial').textContent = v ? v[0].toUpperCase() : '?';
  });

  function join(){
    if(!isOpen()){
      Swal.fire({...style,icon:'error',title:'Session ended',text:'This meeting room closed at 7:00 PM.'});
      return;
    }

    const name=document.getElementById('name').value.trim().toLowerCase();
    if(!name){
      Swal.fire({...style,icon:'warning',title:'Name required',text:'Please enter your name to continue.'});
      return;
    }
    if(!ALLOWED.includes(name)){
      Swal.fire({...style,icon:'warning',title:'Access denied',text:'Only authorized personnel may enter this room.'});
      return;
    }

    Swal.fire({...style,icon:'success',title:'Identity verified',text:'Connecting you to the meeting…'});
    setTimeout(()=>{ window.location.href = MEETING_URL; },1600);
  }

  document.getElementById('name').addEventListener('keydown',e=>{ if(e.key==='Enter') join(); });
</script>
</body>
</html>
