<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Group | Executive Meeting Room</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
  *, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  :root {
    --gold: #C9A84C;
    --gold-light: #E2C97E;
    --dark: #0A0C0F;
    --panel: #111318;
    --border: rgba(201,168,76,0.18);
    --text-muted: rgba(255,255,255,0.45);
  }

  body {
    min-height: 100vh;
    background-color: var(--dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(201,168,76,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(201,168,76,0.04) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
  }

  /* Radial glow */
  body::after {
    content: '';
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 700px;
    height: 700px;
    background: radial-gradient(circle, rgba(201,168,76,0.06) 0%, transparent 70%);
    pointer-events: none;
  }

  /* Corner marks */
  .corner {
    position: fixed;
    width: 60px;
    height: 60px;
  }
  .corner--tl { top: 24px; left: 24px; border-top: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner--tr { top: 24px; right: 24px; border-top: 1px solid var(--gold); border-right: 1px solid var(--gold); }
  .corner--bl { bottom: 24px; left: 24px; border-bottom: 1px solid var(--gold); border-left: 1px solid var(--gold); }
  .corner--br { bottom: 24px; right: 24px; border-bottom: 1px solid var(--gold); border-right: 1px solid var(--gold); }

  /* Ticker */
  .ticker {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 36px;
    background: rgba(201,168,76,0.08);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    overflow: hidden;
  }
  .ticker-label {
    flex-shrink: 0;
    padding: 0 18px;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.2em;
    color: var(--gold);
    text-transform: uppercase;
    border-right: 1px solid var(--border);
    height: 100%;
    display: flex;
    align-items: center;
    background: rgba(201,168,76,0.06);
  }
  .ticker-track {
    display: flex;
    animation: ticker 28s linear infinite;
    white-space: nowrap;
  }
  .ticker-item {
    font-size: 11px;
    color: var(--text-muted);
    padding: 0 28px;
    letter-spacing: 0.08em;
  }
  .ticker-item span {
    color: var(--gold-light);
    margin-right: 6px;
  }
  @keyframes ticker {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }

  /* Status bar */
  .status-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    height: 36px;
    background: rgba(201,168,76,0.05);
    border-top: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    text-transform: uppercase;
  }
  .status-dot {
    display: inline-block;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: #2ECC71;
    margin-right: 7px;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0.4; }
  }

  /* Card */
  .card {
    position: relative;
    z-index: 10;
    width: 440px;
    padding: 52px 48px 44px;
    background: var(--panel);
    border: 1px solid var(--border);
    animation: fadeUp 0.8s cubic-bezier(0.16,1,0.3,1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Top rule */
  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  /* Eyebrow */
  .eyebrow {
    font-size: 10px;
    letter-spacing: 0.25em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .eyebrow::before, .eyebrow::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* Logo */
  .logo {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    color: #fff;
    letter-spacing: 0.03em;
    line-height: 1;
    margin-bottom: 6px;
  }
  .logo span { color: var(--gold); }

  .tagline {
    font-size: 12px;
    color: var(--text-muted);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 36px;
  }

  /* Divider */
  .divider {
    width: 100%;
    height: 1px;
    background: var(--border);
    margin-bottom: 32px;
    position: relative;
  }
  .divider::after {
    content: '◆';
    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    font-size: 8px;
    color: var(--gold);
    background: var(--panel);
    padding: 0 8px;
  }

  /* Label */
  .field-label {
    font-size: 10px;
    letter-spacing: 0.18em;
    color: var(--gold);
    text-transform: uppercase;
    margin-bottom: 8px;
    display: block;
  }

  /* Input */
  .input-wrap {
    position: relative;
    margin-bottom: 20px;
  }
  .input-icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    opacity: 0.6;
    font-size: 14px;
    pointer-events: none;
  }
  input {
    width: 100%;
    padding: 15px 16px 15px 44px;
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: #fff;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    letter-spacing: 0.04em;
    outline: none;
    transition: border-color 0.25s, background 0.25s;
  }
  input::placeholder { color: rgba(255,255,255,0.25); }
  input:focus {
    border-color: var(--gold);
    background: rgba(201,168,76,0.04);
  }

  /* Button */
  .btn {
    width: 100%;
    padding: 16px;
    background: transparent;
    border: 1px solid var(--gold);
    color: var(--gold-light);
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: color 0.3s;
    margin-top: 8px;
  }
  .btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--gold);
    transform: translateX(-101%);
    transition: transform 0.35s cubic-bezier(0.77,0,0.18,1);
    z-index: 0;
  }
  .btn:hover::before { transform: translateX(0); }
  .btn:hover { color: var(--dark); }
  .btn span { position: relative; z-index: 1; }

  /* Footer */
  .card-footer {
    margin-top: 28px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 10px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .secure-badge {
    display: flex;
    align-items: center;
    gap: 5px;
    color: rgba(46,204,113,0.7);
  }
  .secure-badge::before {
    content: '🔒';
    font-size: 10px;
  }

  /* SweetAlert override */
  .swal2-popup {
    background: var(--panel) !important;
    border: 1px solid var(--border) !important;
    color: #fff !important;
    font-family: 'DM Sans', sans-serif !important;
    border-radius: 0 !important;
  }
  .swal2-title { color: #fff !important; font-family: 'Playfair Display', serif !important; }
  .swal2-content { color: var(--text-muted) !important; }
  .swal2-confirm {
    background: transparent !important;
    border: 1px solid var(--gold) !important;
    color: var(--gold) !important;
    border-radius: 0 !important;
    font-family: 'DM Sans', sans-serif !important;
    letter-spacing: 0.15em;
  }
</style>
</head>
<body>

<!-- Corner marks -->
<div class="corner corner--tl"></div>
<div class="corner corner--tr"></div>
<div class="corner corner--bl"></div>
<div class="corner corner--br"></div>

<!-- Ticker -->
<div class="ticker">
  <div class="ticker-label">Live</div>
  <div class="ticker-track" id="track"></div>
</div>

<!-- Status bar -->
<div class="status-bar">
  <div><span class="status-dot"></span>Systems Operational</div>
  <div id="clock"></div>
  <div>Encrypted &nbsp;·&nbsp; TLS 1.3</div>
</div>

<!-- Card -->
<div class="card">
  <div class="eyebrow">Executive Access</div>
  <div class="logo">The <span>Group ( Google Meet class)</span></div>
  <div class="tagline">Virtual Meeting Room</div>

  <div class="divider"></div>

  <label class="field-label">Full Name</label>
  <div class="input-wrap">
    <div class="input-icon">◈</div>
    <input id="name" type="text" placeholder="Enter your name to authenticate" autocomplete="off">
  </div>

  <button class="btn" onclick="join()"><span>Request Access &nbsp;→</span></button>

  <div class="card-footer">
    <div class="secure-badge">Secure Portal</div>
    <div>Meeting Window: 18:00 – 19:00</div>
  </div>
</div>

<script>
  /* Clock */
  function updateClock(){
    const n=new Date();
    const h=String(n.getHours()).padStart(2,'0');
    const m=String(n.getMinutes()).padStart(2,'0');
    const s=String(n.getSeconds()).padStart(2,'0');
    document.getElementById('clock').textContent=h+':'+m+':'+s+' IST';
  }
  setInterval(updateClock,1000);
  updateClock();

  /* Ticker */
  const items=[
    ['Q1 Board Review','Scheduled — 18:00'],
    ['Attendees','2 Authorized'],
    ['Room ID','MQF-XTDG-ARG'],
    ['Platform','Google Meet'],
    ['Security','End-to-End Encrypted'],
    ['Session','60 min'],
  ];
  const track=document.getElementById('track');
  const inner=items.map(([k,v])=>`<span class="ticker-item"><span>${k}</span>${v}</span>`).join('');
  track.innerHTML=inner+inner; // duplicate for seamless loop

  /* Join logic */
  function join(){
    const name=document.getElementById('name').value.trim().toLowerCase();
    const allowed=['avadhoot','ethan'];
    const now=new Date();
    const current=now.getHours()*60+now.getMinutes();
    const open=18*60, close=19*60;

    const style={
      background:'#111318',
      color:'#fff',
      confirmButtonColor:'#C9A84C',
      customClass:{popup:'swal2-popup',title:'swal2-title',confirmButton:'swal2-confirm'}
    };

    if(current<open){
      Swal.fire({...style,icon:'info',title:'Room Not Open',text:'The meeting room opens at 6:00 PM.'});
      return;
    }
    if(current>=close){
      Swal.fire({...style,icon:'error',title:'Session Ended',text:'This meeting concluded at 7:00 PM.'});
      return;
    }
    if(!allowed.includes(name)){
      Swal.fire({...style,icon:'warning',title:'Access Denied',text:'Only authorized personnel may enter this room.'});
      return;
    }
    Swal.fire({...style,icon:'success',title:'Identity Verified',text:'Connecting you to the meeting room…'});
    setTimeout(()=>{ window.location.href='https://meet.google.com/gyc-cguu-eqw'; },1600);
  }

  /* Enter key */
  document.getElementById('name').addEventListener('keydown',e=>{ if(e.key==='Enter') join(); });
</script>
</body>
</html>
